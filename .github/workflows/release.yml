name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/index.cjs "release-assets/skills-mcp-${GITHUB_REF_NAME}.cjs"
          gzip -9 -k "release-assets/skills-mcp-${GITHUB_REF_NAME}.cjs"
          cd release-assets
          sha256sum skills-mcp-*.cjs* > SHA256SUMS.txt
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes